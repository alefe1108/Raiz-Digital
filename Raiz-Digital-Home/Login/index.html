<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- CORRIGIDO: Subindo 2 níveis para achar a pasta img -->
    <img src="../../img/folha.png" alt="" class="bola1">

    <div class="vidro">
        <div class="bloco">

            <button class="voltar" onclick="sair()" type="button">
                <img src="../../img/btnVoltar.png" alt="Voltar à página anterior">
            </button>

            <header>
                <img src="../../img/folha.png" alt="" class="bola2">
                <h1 class="text1">Seja bem vindo de volta!</h1>
                <p class="dica"> preencha os blocos abaixo com informações.</p>
                <img src="../../img/logo.png" alt="">
            </header>
            
            <!-- Formulário de login -->
            <form id="formLogin" action="logar.php" method="POST" novalidate>

                <div class="campo de email">
                    <p class="digitee">Email constitucional</p>
                    <input
                    type="email"
                    name="email"
                    id="email"
                    placeholder="Ex:00001234567911sp@al.educacao.sp.gov.br"
                    required>
                </div>

                <div class="campo de email">
                    <p class="digites">Senha</p>
                    <input
                    type="password"
                    name="senha"
                    id="senha"
                    placeholder="digite sua senha"
                    required>
                    <a href="./Recuperação senha/index.html" class="recuperar">esqueceu sua senha?</a>
                </div>

                <!-- Área para mensagens -->
                <div id="mensagem" style="margin: 10px 0; min-height: 20px;"></div>

            </form>

            <div class="divisor">
                <span></span>
                <p>OU TENTE</p>
                <span></span>
            </div>

            <p class="conta">não tem uma conta?
                <a href="../Cadastro/index.html" class="cadastro"> cadastre-se agora</a>
            </p>

            <button type="button" class="botao">
                Entrar
            </button>

            <img src="../../img/agua.png" alt="" class="agua">

        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
