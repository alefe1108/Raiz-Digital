<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <img src="../../img/folha.png" alt="" class="bola1">

    <div class="vidro">
        
        <div class="bloco">

            <button class="voltar" onclick="history.back()" type="button">
                <img src="../../img/btnVoltar.png" alt="Voltar à página anterior">
            </button>

            <header>
                    <img src="../../img/folha.png" alt="" class="bola2">
                <h1 class="text1">Seja bem vindo de volta!</h1>
                <p class="dica"> preencha os blocos abaixo com informações da sua conta para continuar</p>
                <img src="../../img/logo.png" alt="">
            </header>
            <form id="formCadastro" method="POST" action="/api/cadastro">

                <div class="campo de email">
                    <label for="nome" class="digitee">Nome</label>
                    <input
                    id="nome"
                    type="text"
                    name="nome"
                    placeholder="Josicleiton da Silva ">
                </div>

                <div class="campo de email">
                    <label for="email" class="digitee">Email constitucional</label>
                    <input
                    id="email"
                    type="email"
                    name="email"
                    placeholder="Ex:00001234567911sp@al.educacao.sp.gov.br">
                </div>

                <div class="campo de email">
                    <label for="senha" class="digites">Senha</label>
                    <input 
                    id="senha"
                    type="password"
                    name="senha"
                    placeholder="digite senha">
                </div>

                <div class="campo de email">
                    <label for="ConfirmaSenha" class="digites">Confirmar Senha</label>
                    <input 
                    type="password"
                    id="ConfirmaSenha"
                    name="ConfirmaSenha"
                    placeholder="digite senha">
                </div>

                <div class="campo de email">
                    <p class="aviso">Opcional</p>
                    <label for="Contato" class="digites">Contato</label>
                    <input
                    id="Contato"
                    type="number"
                    name="Contato"
                    placeholder="Digite seu numero de telefone">
                </div>

                <button type="submit" class="botao" value="Cadastrar">
                    Cadastrar-se
                </button>
            </form>
            
            <div class="divisor">
                <span></span>
                <p>OU TENTE</p>
                <span></span>
            </div>

            <p class="conta">já tem uma conta?
                <a href="../Login/index.html" class="cadastro"> Faça seu Login aqui!</a>
            </p>

            <img src="../../img/agua.png" alt="" class="agua">

        </div>
    </div>
    
    <script src="../script.js"></script>

</body>
</html>
